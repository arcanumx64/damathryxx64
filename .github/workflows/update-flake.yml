name: Update Flake and Auto Merge

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight
  workflow_dispatch:     # Allows manual triggering

jobs:
  update-flake:
    runs-on: ubuntu-latest
    outputs:
      pr_created: ${{ steps.create_pr.outputs.pr_created }}
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
      branch_name: ${{ steps.setup_branch.outputs.branch_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup branch name
        id: setup_branch
        run: |
          BRANCH_NAME="update-flake-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Update flake
        run: nix flake update

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet flake.lock; then
            echo "No changes detected in flake.lock."
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in flake.lock."
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.setup_branch.outputs.branch_name }}
          git add flake.lock
          git commit -m "chore: update flake.lock dependencies"
          git push --set-upstream origin ${{ steps.setup_branch.outputs.branch_name }}

      - name: Create Pull Request
        id: create_pr
        if: steps.check_changes.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update flake.lock dependencies"
          branch: ${{ steps.setup_branch.outputs.branch_name }}
          delete-branch: false
          title: "chore: update flake dependencies [automated]"
          body: |
            ## Automated Flake Update

            This PR updates the `flake.lock` file with the latest dependency versions.

            - Updated on: `$(date '+%Y-%m-%d %H:%M:%S')`
            - Auto-generated by: GitHub Actions
          labels: |
            flake-update
            automated
          base: trunk
          draft: false

      - name: Set PR outputs
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          echo "pr_created=true" >> $GITHUB_OUTPUT
          echo "pr_number=${{ steps.create_pr.outputs.pull-request-number }}" >> $GITHUB_OUTPUT

  auto-merge:
    needs: update-flake
    if: needs.update-flake.outputs.pr_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable auto-merge
        run: |
          gh pr merge ${{ needs.update-flake.outputs.pr_number }} --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Pull Request
        uses: hmarr/auto-approve-action@v3
        with:
          pull-request-number: ${{ needs.update-flake.outputs.pr_number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  cleanup-branch:
    needs: [update-flake, auto-merge]
    if: needs.update-flake.outputs.pr_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for merge to complete
        run: |
          # Setup GitHub CLI
          echo "Checking PR status and waiting for merge..."

          MAX_RETRIES=10
          COUNT=0

          while [ $COUNT -lt $MAX_RETRIES ]; do
            PR_STATE=$(gh pr view ${{ needs.update-flake.outputs.pr_number }} --json state -q .state)

            if [ "$PR_STATE" = "MERGED" ]; then
              echo "PR was successfully merged, proceeding to delete branch"
              break
            elif [ "$PR_STATE" = "CLOSED" ]; then
              echo "PR was closed without merging"
              exit 0
            fi

            echo "PR is still open, waiting 30 seconds..."
            sleep 30
            COUNT=$((COUNT+1))
          done

          if [ $COUNT -eq $MAX_RETRIES ]; then
            echo "Timed out waiting for PR to merge"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete branch after merge
        run: |
          echo "Deleting branch ${{ needs.update-flake.outputs.branch_name }}..."
          git push origin --delete ${{ needs.update-flake.outputs.branch_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
