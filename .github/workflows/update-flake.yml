name: Update Flake and Auto Push
# This workflow updates the flake.lock file, runs nix fmt, and pushes changes to the trunk branch.

on:
    schedule:
        - cron: "0 0 * * *" # Runs daily at midnight
    workflow_dispatch: # Allows manual triggering

jobs:
    update-flake:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Nix
              uses: cachix/install-nix-action@v26
              with:
                  nix_path: nixpkgs=channel:nixos-unstable
                  extra_nix_config: |
                      experimental-features = nix-command flakes

            - name: Setup branch name
              id: setup_branch
              run: |
                  BRANCH_NAME="update-flake-$(date +%Y%m%d-%H%M%S)"
                  echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

            - name: Update flake
              run: nix flake update

            - name: Run nix fmt
              run: nix fmt || true

            - name: Check for changes
              id: check_changes
              run: |
                  if git diff --quiet; then
                    echo "No changes detected."
                    echo "changes_detected=false" >> $GITHUB_OUTPUT
                  else
                    echo "Changes detected."
                    echo "changes_detected=true" >> $GITHUB_OUTPUT
                  fi

            - name: Commit and push changes
              if: steps.check_changes.outputs.changes_detected == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add .
                  git commit -m "chore: update flake.lock and format with nix fmt"
                  git push --set-upstream origin trunk --force-with-lease
